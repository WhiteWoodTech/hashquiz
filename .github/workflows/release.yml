name: Release

# Based on WhiteWoodTech/github-repository-template.
#
# - Push to main (merged develop → main PR): stable release vX.Y.Z, npm
#   dist-tag `latest`, 🔖 Release commit on main, then develop is rebased onto
#   main (scripts/sync-develop.js).
# - Manual run on develop (Actions → Release → Run workflow → develop): beta
#   prerelease vX.Y.Z-beta.N, npm dist-tag `beta`, no commit.
#
# A pull_request event cannot be used: semantic-release never publishes from a
# pull request context.
#
# Secrets:
# - NPM_TOKEN: npm token allowed to publish the hashquiz package
# - RELEASE_TOKEN: PAT of a repository admin, to push the release commit to the
#   protected main branch (GITHUB_TOKEN cannot). See docs/DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Semantic Release
    # Skip the push of the release commit itself; manual runs only on main or develop
    if: >-
      ${{ !startsWith(github.event.head_commit.message, '🔖 Release')
      && (github.ref_name == 'main' || github.ref_name == 'develop') }}
    runs-on: ubuntu-latest
    env:
      # No git hooks in CI: lint-staged/commitlint must not run on the release commit
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tokens
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is missing: the hashquiz package cannot be published"
            exit 1
          fi
          if [ -z "$RELEASE_TOKEN" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "::warning::RELEASE_TOKEN secret is missing: the release commit cannot be pushed to a protected main branch"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      # Stages pkg/ (CLI bundle + prebuilt apps); semantic-release sets its version
      - name: Build npm package
        run: bun run pack

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Signed provenance attestation on npmjs.com (needs id-token: write)
          NPM_CONFIG_PROVENANCE: 'true'
        run: bun run release

      # Rebase develop onto main (rewritten SHAs + 🔖 Release commit) so the next
      # develop → main PR is up to date. On conflict, run `bun run sync:develop`.
      - name: Sync develop with main
        if: github.ref_name == 'main'
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SYNC_REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            bun scripts/sync-develop.js
