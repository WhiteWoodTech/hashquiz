<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>HashQuiz — real-time multiplayer quiz</title>
  <meta name="description" content="Join a HashQuiz game with the code shown on screen: real-time multiplayer quizzes written in Markdown, no account needed.">
  <meta name="theme-color" content="#130A42">
  <!-- Until a public landing page exists the join screen stays out of search results; `hashquiz build` drops this tag with HASHQUIZ_INDEXABLE=true -->
  <meta name="robots" content="noindex">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="HashQuiz">
  <meta property="og:title" content="HashQuiz — real-time multiplayer quiz">
  <meta property="og:description" content="Join the game with the code shown on screen. No account needed.">
  <meta property="og:image" content="/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- hashquiz:head (canonical and og:url, written by `hashquiz build` from HASHQUIZ_SITE_URL) -->
</head>
<body>
  <div id="app"></div>
  <!-- Deployment settings, written by `hashquiz build` (see packages/core/src/runtime-config.ts) -->
  <script src="/hashquiz-config.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
